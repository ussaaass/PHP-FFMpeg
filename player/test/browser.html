<!doctype html>
<html lang="en" data-test-status="loading">
<meta charset="utf-8">
<title>CTR/HMAC player integration check</title>
<video id="video" muted playsinline></video>
<pre id="result"></pre>
<script type="module">
  import { HlsCtrPlayer, PlaybackDescriptorUrl, PlaybackProfile } from '/dist/index.js';

  const element = document.documentElement;
  const result = document.querySelector('#result');
  const video = document.querySelector('#video');
  const failures = [];
  const warnings = [];
  window.__testWarnings = warnings;
  const events = [];
  window.__testEvents = events;
  const mode = new URL(location.href).searchParams.get('mode') || 'switch';
  const manualLevelMatch = /^manual-(\d+)$/.exec(mode);
  const manualLevel = manualLevelMatch ? Number(manualLevelMatch[1]) : null;
  let soughtAfterSwitch = false;
  for (const type of ['loadedmetadata', 'canplay', 'waiting', 'playing', 'timeupdate', 'ended', 'error']) {
    video.addEventListener(type, () => events.push({ type, currentTime: video.currentTime, duration: video.duration, readyState: video.readyState, mediaError: video.error?.message }));
  }
  let player;
  let requestedHighLevel = false;
  player = new HlsCtrPlayer(video, {
    hlsConfig: ['auto', 'auto-seek', 'constant', 'ramp-up', 'ramp-down', 'fluctuate', 'weak', 'weak-rustfs', 'proxy-weak', 'proxy-range', 'proxy-seek', 'rustfs-etag-change'].includes(mode) || manualLevel !== null
      ? { abrEwmaDefaultEstimate: 900000, startLevel: manualLevel ?? -1, capLevelToPlayerSize: false, maxBufferLength: 3, maxMaxBufferLength: 6, backBufferLength: 4 }
      : {},
    keyProviderTimeoutMilliseconds: mode === 'key-timeout' ? 150 : undefined,
    keyProvider: {
      async getMasterKey({ keyId, profile, signal }) {
        if (mode === 'key-timeout') return new Promise(() => {});
        if (mode === 'key-denied') throw new Error('Unknown keyId; secret diagnostic must not escape');
        if (keyId !== 'interop-test-key' || profile !== PlaybackProfile.CTR_HMAC_V1 || signal.aborted) throw new Error('Unexpected fixture key request');
        return Uint8Array.from(atob('AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8='), char => char.charCodeAt(0));
      },
    },
    onError: error => {
      if (['key-timeout', 'key-denied'].includes(mode) && error.code?.startsWith('PLAYER_KEY_PROVIDER_')) {
        failures.push(error);
        element.dataset.testStatus = 'failed';
        result.textContent = JSON.stringify({ mode, failures, metrics: player?.getMetrics() }, null, 2);
        return;
      }
      if (['etag-change', 'rustfs-etag-change'].includes(mode) && error.error?.includes('Range resume response did not match the original object')) {
        events.push({ type: 'object-version-mismatch-rejected' });
        const rustfsFault = mode === 'rustfs-etag-change'
          ? fetch('/rustfs-fault-status').then(response => response.json())
          : Promise.resolve(null);
        rustfsFault.then(fault => {
          const validFault = mode !== 'rustfs-etag-change' || (
            fault.initialInterrupted
            && fault.replacementConfirmed
            && fault.originalEtag
            && fault.replacementEtag !== fault.originalEtag
            && fault.resumeRequest?.range === 'bytes=65592-'
            && fault.resumeRequest?.ifRange === fault.originalEtag
            && fault.resumeRequest?.etag === fault.replacementEtag
            && [200, 206].includes(fault.resumeRequest?.status)
            && fault.resumeRequest?.contentRange?.startsWith('bytes 65592-')
          );
          if (!validFault) failures.push({ code: 'rustfs-object-replacement-evidence-invalid', fault });
          element.dataset.testStatus = validFault ? 'passed' : 'failed';
          result.textContent = JSON.stringify({ mode, expectedRejection: true, fault, error: error.error, failures }, null, 2);
        });
        return;
      }
      (error.fatal ? failures : warnings).push(error);
      if (error.fatal) {
        element.dataset.testStatus = 'failed';
        result.textContent = JSON.stringify({ mode, failures, warnings, metrics: player?.getMetrics() }, null, 2);
        return;
      }
      if (error.code === 'PLAYER_CODEC_UNSUPPORTED') {
        element.dataset.testStatus = 'failed';
        result.textContent = JSON.stringify({ mode, failures, warnings, unsupportedCodec: error.codec }, null, 2);
      }
    },
    onEvent: event => {
      events.push(event);
      if (mode === 'auto-seek' && !soughtAfterSwitch && event.type === 'level-switched' && event.automatic && event.level === 2) {
        soughtAfterSwitch = true;
        player.seek(4);
        events.push({ type: 'seek-after-automatic-switch', target: 4 });
      }
      if (mode === 'switch' && !requestedHighLevel && event.type === 'segment-buffered' && event.sequence === 0) {
        requestedHighLevel = true;
        player.setLevel(2);
      }
    },
  });
  window.__testHls = player.hls;
  video.addEventListener('ended', async () => {
    const levels = new Set(events.filter(event => event.type === 'segment-buffered').map(event => event.level));
    const serverStatus = await fetch('/test-status').then(response => response.json());
    let rustfsRange = null;
    if (['rustfs', 'weak-rustfs', 'proxy', 'proxy-weak', 'proxy-range', 'proxy-seek'].includes(mode)) {
      try {
        const { prefix } = await fetch('/test-rustfs').then(response => response.json());
        const segmentUrl = new URL('v360p/segment_00000.enc.m4s', prefix).href;
        const head = await fetch(segmentUrl, { method: 'HEAD' });
        const etag = head.headers.get('etag');
        const sidecar = await fetch(`${segmentUrl}.json`).then(response => response.json());
        const firstRecordBytes = 24 + sidecar.records[0].ciphertextLength + sidecar.records[0].tagLength;
        const range = await fetch(segmentUrl, { headers: { Range: `bytes=0-${firstRecordBytes - 1}`, 'If-Range': etag } });
        const rangeBytes = await range.arrayBuffer();
        const repeatedRange = await fetch(segmentUrl, { headers: { Range: `bytes=0-${firstRecordBytes - 1}`, 'If-Range': etag } });
        const repeatedRangeBytes = await repeatedRange.arrayBuffer();
        const cacheProbe = await fetch(segmentUrl);
        const cacheProbeBytes = await cacheProbe.arrayBuffer();
        const repeatedCacheProbe = await fetch(segmentUrl);
        const repeatedCacheProbeBytes = await repeatedCacheProbe.arrayBuffer();
        rustfsRange = {
          headStatus: head.status,
          rangeStatus: range.status,
          contentRange: range.headers.get('content-range'),
          etag,
          responseEtag: range.headers.get('etag'),
          expectedBytes: firstRecordBytes,
          recordBoundaries: sidecar.records.slice(0, -1).map((record, index) => sidecar.records.slice(0, index + 1).reduce((sum, item) => sum + 24 + item.ciphertextLength + item.tagLength, 0)),
          actualBytes: rangeBytes.byteLength,
          contentEncoding: range.headers.get('content-encoding'),
          repeatedRangeStatus: repeatedRange.status,
          repeatedRangeBytes: repeatedRangeBytes.byteLength,
          fullCacheStatus: cacheProbe.headers.get('x-cache'),
          repeatedFullCacheStatus: repeatedCacheProbe.headers.get('x-cache'),
          fullCacheBytes: cacheProbeBytes.byteLength,
          repeatedFullCacheBytes: repeatedCacheProbeBytes.byteLength,
        };
        if (!head.ok || !etag || range.status !== 206 || rustfsRange.actualBytes !== firstRecordBytes
          || rustfsRange.responseEtag !== etag || !rustfsRange.contentRange?.startsWith(`bytes 0-${firstRecordBytes - 1}/`)) {
          failures.push({ code: 'rustfs-cross-origin-range-etag-failed', rustfsRange });
        }
        if (mode.startsWith('proxy-') || mode === 'proxy') {
          if (rustfsRange.contentEncoding !== null || rustfsRange.repeatedRangeStatus !== 206
            || rustfsRange.fullCacheBytes === 0 || rustfsRange.fullCacheBytes !== rustfsRange.repeatedFullCacheBytes
            || rustfsRange.repeatedFullCacheStatus !== 'HIT') {
            failures.push({ code: 'nginx-range-cache-or-content-encoding-failed', rustfsRange });
          }
        }
      } catch (error) {
        failures.push({ code: 'rustfs-cross-origin-range-fetch-failed', message: error.message });
      }
    }
    if (mode === 'switch' && (!levels.has(0) || !levels.has(2))) failures.push({ code: 'rendition-switch-not-observed', levels: [...levels] });
    if (['auto', 'auto-seek'].includes(mode)) {
      const automaticLevels = events.filter(event => event.type === 'level-switched' && event.automatic).map(event => event.level);
      const upIndex = automaticLevels.indexOf(2);
      if (upIndex < 0 || !automaticLevels.slice(upIndex + 1).includes(0)) failures.push({ code: 'automatic-up-down-switch-not-observed', automaticLevels });
    }
    if (mode === 'auto-seek' && (!soughtAfterSwitch || !events.some(event => event.type === 'timeupdate' && event.currentTime >= 3.5))) failures.push({ code: 'seek-after-switch-not-observed' });
    if (mode === 'ramp-up') {
      const bufferedLevels = events.filter(event => event.type === 'segment-buffered').map(event => event.level);
      if (new Set(bufferedLevels).size < 2) failures.push({ code: 'bandwidth-upshift-not-observed', bufferedLevels });
    }
    if (mode === 'ramp-down') {
      const switchedLevels = events.filter(event => event.type === 'level-switched' && event.automatic).map(event => event.level);
      const highIndex = switchedLevels.findIndex(level => level > 0);
      if (highIndex < 0 || !switchedLevels.slice(highIndex + 1).includes(0)) failures.push({ code: 'bandwidth-downshift-not-observed', switchedLevels });
    }
    if (['range', 'proxy-range'].includes(mode) && (!serverStatus.forcedTruncation || serverStatus.rangeRequests < 1)) failures.push({ code: 'range-resume-not-observed', serverStatus });
    if (mode === 'proxy-range' && (serverStatus.truncatedResponses !== 3 || serverStatus.rangeRequests !== 3)) failures.push({ code: 'three-record-boundary-retries-not-observed', serverStatus });
    if (['seek', 'proxy-seek'].includes(mode) && !events.some(event => event.type === 'timeupdate' && event.currentTime >= 3.5)) failures.push({ code: 'seek-position-not-observed' });
    if (mode === 'hevc' && (video.videoHeight < 700 || events.filter(event => event.type === 'segment-buffered').length < 3)) failures.push({ code: 'hevc-720p-playback-not-observed', width: video.videoWidth, height: video.videoHeight });
    const playbackMetrics = player.getMetrics();
    if (!playbackMetrics.completed || playbackMetrics.fatalErrors !== 0 || playbackMetrics.bufferedSegments < 1) failures.push({ code: 'packaged-player-metrics-incomplete', playbackMetrics });
    if (['auto', 'auto-seek'].includes(mode) && playbackMetrics.automaticLevelSwitches < 2) failures.push({ code: 'packaged-player-automatic-switch-metrics-missing', playbackMetrics });
    const authenticatedSegments = events.filter(event => event.type === 'segment-authenticated');
    const authenticatedIds = new Set(authenticatedSegments.map(event => `${event.level}:${event.sequence}`));
    const unauthenticatedAppends = events.filter(event => event.type === 'segment-buffered' && !authenticatedIds.has(`${event.level}:${event.sequence}`));
    if (unauthenticatedAppends.length || authenticatedSegments.length < 1 || authenticatedSegments.some(event => !/^[a-f0-9]{64}$/.test(event.clearSha256) || !event.keyId || !Number.isInteger(event.recordCount))) {
      failures.push({ code: 'per-segment-authentication-report-incomplete', unauthenticatedAppends, authenticatedCount: authenticatedSegments.length, playbackMetrics });
    }
    if (manualLevel !== null) {
      const loadedLevels = events.filter(event => event.type === 'segment-buffered').map(event => event.level);
      if (!loadedLevels.length || loadedLevels.some(level => level !== manualLevel) || playbackMetrics.manualLevelSwitches < 1) {
        failures.push({ code: 'manual-rendition-lock-not-observed', manualLevel, loadedLevels, playbackMetrics });
      }
    }
    if (mode === 'fluctuate' && events.filter(event => event.type === 'segment-buffered').length < 5) failures.push({ code: 'fluctuation-profile-buffered-too-few-segments' });
    element.dataset.testStatus = failures.length ? 'failed' : 'passed';
    result.textContent = JSON.stringify({ mode, failures, warnings, events, playbackMetrics, serverStatus, rustfsRange, duration: video.duration, currentTime: video.currentTime, videoWidth: video.videoWidth, videoHeight: video.videoHeight }, null, 2);
  }, { once: true });
  try {
    await player.load(PlaybackDescriptorUrl.from('/media/playback.json'));
    if (manualLevel !== null) {
      const levelsDeadline = Date.now() + 15000;
      while (player.getLevels().length <= manualLevel && Date.now() < levelsDeadline) await new Promise(resolve => setTimeout(resolve, 50));
      if (player.getLevels().length <= manualLevel) throw new Error(`Manual level ${manualLevel} was not present in the master playlist`);
      player.setLevel(manualLevel);
      events.push({ type: 'manual-level-lock-requested', level: manualLevel });
    }
    const deadline = Date.now() + 15000;
    while (!Number.isFinite(video.duration) && Date.now() < deadline) await new Promise(resolve => setTimeout(resolve, 50));
    if (!Number.isFinite(video.duration)) throw new Error('Player did not receive media metadata');
    if (['seek', 'proxy-seek'].includes(mode)) player.seek(4);
    await player.play();
    setTimeout(() => {
      if (element.dataset.testStatus === 'loading') {
        element.dataset.testStatus = 'timed-out';
        result.textContent = JSON.stringify({ failures, warnings, events, duration: video.duration, currentTime: video.currentTime, buffered: Array.from({ length: video.buffered.length }, (_, i) => [video.buffered.start(i), video.buffered.end(i)]) }, null, 2);
      }
      }, ['weak', 'weak-rustfs', 'proxy-weak', 'proxy-range', 'proxy-seek', 'constant', 'ramp-up', 'ramp-down', 'fluctuate', 'auto-seek'].includes(mode) ? 180000 : (mode === 'rustfs-etag-change' ? 90000 : 30000));
  } catch (error) {
    failures.push({ code: 'test-start-failed', message: error.message });
    element.dataset.testStatus = 'failed';
    result.textContent = JSON.stringify({ failures }, null, 2);
  }
  window.__testPlayer = player;
</script>
</html>
