services:
  browser-test:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /workspace/player
    volumes:
      - ../..:/workspace
    environment:
      V2_ACCEPTANCE_ROOT: /workspace/experiments/hls-ctr-v2-acceptance/output
      CHROMIUM_EXECUTABLE_PATH: /ms-playwright/chromium-1243/chrome-linux-arm64/chrome
    command: ["npm", "run", "test:v2-browser"]
    init: true
