services:
  browser-test:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /workspace/player
    volumes:
      - ../..:/workspace
    environment:
      V2_ACCEPTANCE_ROOT: /workspace/experiments/hls-ctr-v2-acceptance/output
      CHROMIUM_EXECUTABLE_PATH: /ms-playwright/chromium-1243/chrome-linux-arm64/chrome
    command: ["npm", "run", "test:v2-browser"]
    init: true

  fixture-server:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /workspace/player
    volumes:
      - ../..:/workspace
    environment:
      V2_ACCEPTANCE_ROOT: /workspace/experiments/hls-ctr-v2-acceptance/output
      V2_ACCEPTANCE_BIND: 0.0.0.0
      V2_ACCEPTANCE_SERVE_ONLY: "1"
    ports:
      - "127.0.0.1:8793:8793"
    command: ["node", "test/v2-browser.mjs"]
    init: true

  nginx-proxy:
    image: nginx:1.29-alpine
    depends_on:
      - fixture-server
    ports:
      - "127.0.0.1:8794:8080"
    volumes:
      - ./nginx-v2.conf:/etc/nginx/conf.d/default.conf:ro
    init: true
