worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events { worker_connections 256; }

http {
    access_log /dev/stdout;
    sendfile on;
    gzip off;

    proxy_cache_path /var/cache/nginx/hls levels=1:2 keys_zone=hls_cache:10m max_size=256m inactive=10m use_temp_path=off;

    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://127.0.0.1:8791;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }

    server {
        listen 8081;
        server_name _;

        location / {
            if ($request_method = OPTIONS) { return 204; }

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, If-Range, Content-Type, Authorization" always;
            add_header Access-Control-Expose-Headers "ETag, Content-Range, Content-Length, Accept-Ranges, Age, X-Cache" always;
            add_header Vary Origin always;
            add_header X-Cache $upstream_cache_status always;

            proxy_pass http://127.0.0.1:8791/media/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_set_header Accept-Encoding "";
            proxy_buffering on;
            proxy_request_buffering off;
            proxy_force_ranges on;
            proxy_cache hls_cache;
            proxy_cache_bypass $http_range;
            proxy_no_cache $http_range;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$scheme$proxy_host$request_uri$http_range$http_if_range";
            proxy_cache_lock on;
            proxy_cache_valid 200 206 5m;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
        }

        location ^~ /rustfs-proxy/ {
            if ($request_method = OPTIONS) { return 204; }

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, If-Range, Content-Type, Authorization" always;
            add_header Access-Control-Expose-Headers "ETag, Content-Range, Content-Length, Accept-Ranges" always;
            add_header Vary Origin always;

            proxy_pass http://127.0.0.1:8791/rustfs-proxy/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
        }
    }
}
